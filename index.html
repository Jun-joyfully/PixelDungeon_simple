<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PIXEL DUNGEON - 16-BIT RETRO RPG (PixelFX Edition v10.1)</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css"></noscript>
<script>(function(){function show(m){var b=document.getElementById('fatal-error-box');if(!b){b=document.createElement('div');b.id='fatal-error-box';b.style.cssText='position:fixed;left:8px;right:8px;bottom:8px;z-index:99999;padding:10px 14px;background:#8b1824;color:#fff;border:3px solid #ff4757;font:12px monospace;white-space:pre-wrap;user-select:text';(document.body||document.documentElement).appendChild(b);}b.textContent='⚠️ 오류 발생: '+m+'\n(문제가 계속되면 [데이터 초기화]를 눌러보세요)';}window.addEventListener('error',function(e){ var m = e.message || 'unknown error'; if (e.filename) m += ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')'; show(m); });window.addEventListener('unhandledrejection',function(e){show(String(e.reason));});})();</script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="game-app">
  <div id="top-bar" class="hidden">
    <div class="hp-plate">❤️<div class="hp-box"><div class="hp-fill" id="top-hp-fill"></div><span id="top-hp-txt"></span></div></div>
    <div class="chips">
      <div class="chip" style="color:var(--gold)" id="chip-gold"></div>
      <div class="chip" style="color:#70a1ff" id="chip-keys"></div>
      <div class="chip" style="color:var(--pink)" id="chip-shards"></div>
      <div class="chip" style="color:var(--cyan)" id="chip-stage"></div>
    </div>
  </div>

  <section class="scene active" id="scene-title">
    <canvas id="title-bg"></canvas>
    <div class="title-head">
      <h1>PIXEL DUNGEON</h1>
      <div class="title-sub">⚔️ 16-BIT DARK FANTASY PIXEL EDITION ⚔️</div>
    </div>
    <div class="title-actions">
      <button class="btn orange" data-act="start">⚔️ 게임 시작 [Enter]</button>
      <button class="btn" data-act="reset">🔄 데이터 초기화 (새 게임)</button>
    </div>
  </section>

  <section class="scene" id="scene-menu">
    <div class="menu-body">
      <div class="panel hero-card">
        <div class="hero-name">모험가</div>
        <div class="avatar" style="position:relative"><canvas id="menu-hero"></canvas><canvas id="menu-pet" style="position:absolute;bottom:0;right:-18px;width:34px;height:34px;display:none"></canvas></div>
        <div id="menu-gear" style="width:100%;display:flex;flex-direction:column;gap:6px"></div>
      </div>
      <div class="panel menu-opts">
        <div class="banner"><span>🏰 마을 광장 (MAIN MENU)</span><span style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><small>[Enter] 던전 입장 · [ESC] 타이틀</small><button class="btn mini purple" id="mod-btn" onclick="openModList()">🧩 모드</button></span></div>
        <div class="stage-bar">
          <div class="stage-row" id="world-row" style="display:none">
            <label>🌍 월드 선택:</label>
            <select id="world-select" onchange="setWorld(this.value)"></select>
            <small id="world-desc" style="color:var(--sub)"></small>
          </div>
          <div class="stage-row">
            <label>🗺️ 층 선택:</label>
            <button class="btn mini" data-act="stage" data-d="-10">◀10</button>
            <button class="btn mini" data-act="stage" data-d="-1">◀</button>
            <select id="stage-select"></select>
            <button class="btn mini" data-act="stage" data-d="1">▶</button>
            <button class="btn mini" data-act="stage" data-d="10">10▶</button>
            <button class="btn mini gold" data-act="stage-max">최고층</button>
          </div>
          <div class="stage-row">
            <label>🔍 층 검색:</label>
            <input id="stage-search" type="text" placeholder="층 번호 또는 보스/엘리트 검색 (예: 50, 보스)">
            <button class="btn mini cyan" data-act="stage-go">이동</button>
            <button class="btn mini" data-act="stage-clear" id="stage-clear" style="display:none">초기화</button>
          </div>
        </div>
        <div class="menu-grid" id="menu-grid"></div>
      </div>
    </div>
  </section>

  <section class="scene" id="scene-battle">
    <div class="b-hud">
      <div class="side hero">
        <div class="gem">❤️</div>
        <div class="info"><div class="nm"><span style="color:var(--cyan)">모험가</span><span id="b-hero-hp"></span></div><div class="bar18 hero"><div id="b-hero-bar"></div></div></div>
      </div>
      <div class="center">
        <div class="stage-badge" id="b-stage"></div>
        <div class="repeat-ctl" id="b-repeat"><span>🔁 반복중 (골드 80%)</span><button class="btn mini gold" data-act="next-floor">🔼 다음층 도전</button></div>
      </div>
      <div class="side enemy">
        <div class="gem" id="b-mon-icon"></div>
        <div class="info"><div class="nm"><span style="color:var(--gold)" id="b-mon-name"></span><span id="b-mon-hp"></span></div><div class="bar18 enemy"><div id="b-mon-bar"></div></div></div>
      </div>
    </div>
    <div class="arena" id="battle-viewport">
      <div id="raid-timer-banner" style="display:none;position:absolute;top:8px;left:50%;transform:translateX(-50%);background:rgba(139,24,36,0.92);border:2px solid var(--red);padding:4px 12px;font-size:.78rem;font-weight:bold;color:#fff;z-index:20;border-radius:4px;box-shadow:0 0 10px rgba(255,71,87,0.6)">⏳ 차원 붕괴까지: <span id="raid-turns-left" style="color:var(--gold)">15</span>턴</div>
      <canvas class="bg" id="battle-bg"></canvas>
      <div class="actor hero" id="hero-actor"><canvas id="hero-battle-canvas"></canvas><canvas id="pet-battle-canvas" style="position:absolute;bottom:0;left:-32px;width:36px;height:36px;display:none"></canvas></div>
      <div class="actor enemy" id="enemy-actor"><canvas id="monster-battle-canvas"></canvas></div>
      <canvas class="fx" id="battle-fx-canvas"></canvas>
      <div class="skip-overlay" id="skip-overlay"><button class="btn orange" data-act="skip">⚡ 스킵 (즉시 결착) [Enter]</button></div>
    </div>
    <div class="dock" id="dock"></div>
    <div class="b-log">
      <div class="hd"><span>📜 실시간 전투 일지</span><span id="b-turn">턴 1</span></div>
      <div class="log-box" id="log-box"></div>
    </div>
  </section>

  <section class="scene" id="scene-forge">
    <div class="sub-head">🔨 고대 룬 &amp; 초월 대장간 (TRANSCEND FORGE)<button class="btn" data-act="menu">🏠 마을 광장으로 복귀 [ESC]</button></div>
    <div class="forge-body">
      <div class="altar" id="forge-altar">
        <canvas class="bg" id="forge-bg"></canvas>
        <canvas class="fx" id="forge-fx-canvas"></canvas>
        <div class="hammer" id="forge-hammer">🔨</div>
        <div class="magic-circle"><canvas id="forge-item-canvas"></canvas></div>
        <div class="forge-title" id="forge-title"></div>
        <div class="star-badge" id="forge-badge"></div>
        <div class="live-banner" id="forge-banner"></div>
        <div class="ticker" id="forge-ticker"></div>
      </div>
      <div class="panel forge-side" id="forge-side"></div>
    </div>
  </section>

  <section class="scene" id="scene-character">
    <div class="sub-head">📜 모험가 상세 정보 (ESTATE ROSTER)<button class="btn" data-act="menu">🏠 마을 광장으로 복귀 [ESC]</button></div>
    <div class="char-body">
      <div class="panel char-left"><div class="pedestal"><canvas id="char-hero"></canvas></div><div id="char-stats"></div></div>
      <div class="char-right" id="char-right"></div>
    </div>
  </section>
</div>
<div id="modals"></div>
<script src="pixelfx.js"></script>
<script src="game.js"></script>
<script src="mods/mods.js"></script>
</body>
</html>
